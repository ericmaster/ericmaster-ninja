name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Spec: docs/specs/resume-positioning.md
      - name: Install PDF test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - run: npm ci

      - run: npm test

      - run: npm run build
