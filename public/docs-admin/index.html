<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Branded Docs — Content Manager</title>
  </head>
  <body>
    <!--
      LAN-accessible authoring surface for the private branded-docs repo.
      Served by `npm run docs:cms` (astro dev + the Decap proxy, both bound to
      0.0.0.0) so it can be opened from another device on the LAN, e.g.
      http://<box-ip>:4321/docs-admin/index.html (the dev server needs the
      explicit index.html). Blocked (404) in production via public/_redirects.
      Edits read/write branded-docs/docs/*.md on disk — no cloud, no OAuth, no
      secrets. See branded-docs/README.md.
    -->
    <script>
      // Manual init so we can compute local_backend at runtime (below).
      window.CMS_MANUAL_INIT = true;

      // Decap calls crypto.randomUUID() on startup, which browsers only expose
      // in a "secure context" (https, or http://localhost / 127.0.0.1). Opened
      // over a plain-http LAN IP (e.g. from a phone) that API is missing and
      // Decap fails to load with "crypto.randomUUID is not a function".
      // getRandomValues() IS available on non-secure origins, so polyfill from
      // it and the UI loads anywhere.
      if (typeof crypto !== "undefined" && !crypto.randomUUID) {
        crypto.randomUUID = () =>
          "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
            (
              c ^
              (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))
            ).toString(16)
          );
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Point Decap's local backend at whatever host served this page — LAN IP,
      // mesh IP, or hostname — so it works over any access path without a
      // hardcoded address. The decap-server proxy runs on 8083 on the same box
      // (bound to 0.0.0.0 by `npm run docs:cms`). `allowed_hosts` lets the local
      // backend engage from a non-localhost origin. Merged over config.yml.
      (function () {
        var host = location.hostname;
        window.CMS.init({
          config: {
            local_backend: {
              url: location.protocol + "//" + host + ":8083/api/v1",
              allowed_hosts: [host],
            },
          },
        });

        // Export-to-PDF button, shown in each document's preview pane. It links
        // to the docs-export server (port 8084, started by `npm run docs:cms`)
        // on the same host that served this page. Export renders the SAVED file,
        // so publish first. Uses the parent host (captured here) rather than the
        // preview iframe's own location, which is blank.
        var EXPORT_BASE = location.protocol + "//" + host + ":8084";
        var DocPreview = createClass({
          render: function () {
            var entry = this.props.entry;
            var data = entry.get("data");
            var slug = entry.get("slug") || "";
            var href = EXPORT_BASE + "/export?doc=" + encodeURIComponent(slug);
            var open = function () {
              (window.top || window).open(href, "_blank", "noopener");
            };
            return h(
              "div",
              { style: { padding: "1rem", fontFamily: "system-ui, sans-serif", color: "#1f2733" } },
              slug
                ? h(
                    "button",
                    {
                      onClick: open,
                      style: {
                        display: "inline-block", padding: "0.7rem 1.2rem", border: "0",
                        background: "#405282", color: "#fff", borderRadius: "8px",
                        fontWeight: 600, fontSize: "1rem", cursor: "pointer",
                      },
                    },
                    "⬇ Export PDF"
                  )
                : h("em", { style: { color: "#8a94a6" } }, "Publish this document to enable PDF export."),
              h(
                "p",
                { style: { color: "#8a94a6", fontSize: "0.85rem", margin: "0.5rem 0 1rem" } },
                "Exports the last published version."
              ),
              h("hr", { style: { border: "0", borderTop: "1px solid #e6e9ef" } }),
              h("h1", { style: { color: "#405282" } }, data.get("title") || slug),
              h("div", {}, this.props.widgetFor("body"))
            );
          },
        });
        window.CMS.registerPreviewTemplate("documents", DocPreview);
      })();
    </script>
  </body>
</html>
