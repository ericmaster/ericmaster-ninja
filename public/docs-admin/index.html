<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Branded Docs — Content Manager</title>
  </head>
  <body>
    <!--
      LOCAL-ONLY authoring surface for the private branded-docs repo.
      Served by `astro dev` at http://localhost:4321/docs-admin/index.html
      (the dev server needs the explicit index.html) and blocked
      (404) in production via public/_redirects. Uses Decap's local backend:
      `npm run docs:cms` starts astro dev AND the Decap proxy (port 8083)
      together; edits then read/write branded-docs/docs/*.md directly on disk.
      No cloud, no OAuth, no secrets. See branded-docs/README.md.
    -->
    <script>
      // Decap calls crypto.randomUUID() on startup, which browsers only expose
      // in a "secure context" (https, or http://localhost / 127.0.0.1). Opened
      // over a plain-http LAN IP (e.g. from a phone) that API is missing and
      // Decap fails to load with "crypto.randomUUID is not a function".
      // getRandomValues() IS available on non-secure origins, so polyfill from
      // it and the UI loads anywhere. (Local editing still needs a localhost
      // origin or local_backend.allowed_hosts — see branded-docs/README.md.)
      if (typeof crypto !== "undefined" && !crypto.randomUUID) {
        crypto.randomUUID = () =>
          "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
            (
              c ^
              (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))
            ).toString(16)
          );
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
